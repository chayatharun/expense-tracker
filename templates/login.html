{% extends "base.html" %}


{% block title %}
Login - Expense Tracker
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="auth-icon">
                👋
            </span>

            <h1>
                Welcome Back
            </h1>

            <p>
                Take control of your spending.
            </p>

        </div>


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create one
            </a>

        </p>

    </div>

</section>

{% endblock %}
