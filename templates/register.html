{% extends "base.html" %}


{% block title %}
Register - Expense Tracker
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="auth-icon">
                💰
            </span>

            <h1>
                Create Account
            </h1>

            <p>
                Start understanding where your money goes.
            </p>

        </div>


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    required
                    minlength="6"
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
