{% extends "base.html" %}


{% block title %}
Edit Expense - Expense Tracker
{% endblock %}


{% block content %}

<section class="form-page">

    <div class="form-card">

        <div class="form-header">

            <p class="eyebrow">
                TRANSACTION
            </p>

            <h1>
                Edit Expense
            </h1>

            <p>
                Update the details of this expense.
            </p>

        </div>


        <form
            method="POST"
            class="expense-form"
        >


            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <div class="amount-input">

                    <span>
                        ₹
                    </span>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        value="{{ expense.amount }}"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="category_id">
                    Category
                </label>

                <select
                    id="category_id"
                    name="category_id"
                    required
                >

                    {% for category in categories %}

                        <option
                            value="{{ category.category_id }}"
                            {% if category.category_id == expense.category_id %}
                                selected
                            {% endif %}
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    value="{{ expense.description or '' }}"
                    maxlength="255"
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="transaction_date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        value="{{ expense.transaction_date }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="payment_method">
                        Payment Method
                    </label>

                    <select
                        id="payment_method"
                        name="payment_method"
                        required
                    >

                        <option
                            value="UPI"
                            {% if expense.payment_method == "UPI" %}
                                selected
                            {% endif %}
                        >
                            UPI
                        </option>


                        <option
                            value="Cash"
                            {% if expense.payment_method == "Cash" %}
                                selected
                            {% endif %}
                        >
                            Cash
                        </option>


                        <option
                            value="Debit Card"
                            {% if expense.payment_method == "Debit Card" %}
                                selected
                            {% endif %}
                        >
                            Debit Card
                        </option>


                        <option
                            value="Credit Card"
                            {% if expense.payment_method == "Credit Card" %}
                                selected
                            {% endif %}
                        >
                            Credit Card
                        </option>


                        <option
                            value="Bank Transfer"
                            {% if expense.payment_method == "Bank Transfer" %}
                                selected
                            {% endif %}
                        >
                            Bank Transfer
                        </option>


                        <option
                            value="Other"
                            {% if expense.payment_method == "Other" %}
                                selected
                            {% endif %}
                        >
                            Other
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-actions">

                <a
                    href="/expenses"
                    class="secondary-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Changes
                </button>

            </div>


        </form>

    </div>

</section>

{% endblock %}
