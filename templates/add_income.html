{% extends "base.html" %}

{% block title %}Add Income - Expense Tracker{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <div class="form-header">
            <p class="eyebrow">PERSONAL FINANCE</p>
            <h1>Add Income</h1>
            <p>Record money you received.</p>
        </div>

        <form method="POST" class="expense-form">
            <div class="form-group">
                <label for="amount">Amount</label>
                <div class="amount-input">
                    <span>₹</span>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="30000"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="category">Income Category</label>
                <select id="category" name="category_id" required>
                    <option value="">Select category</option>
                    {% for category in categories %}
                        <option value="{{ category.category_id }}">
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="Example: Monthly salary"
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="transaction_date">Date</label>
                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        value="{{ today }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="payment_method">Payment Method</label>
                    <select id="payment_method" name="payment_method">
                        <option value="">Select method</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('dashboard') }}" class="secondary-button">
                    Cancel
                </a>
                <button type="submit" class="primary-button">
                    Add Income
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
