{% extends "base.html" %}


{% block title %}
Add Expense - Expense Tracker
{% endblock %}


{% block content %}

<section class="form-page">

    <div class="form-card">

        <div class="form-header">

            <p class="eyebrow">
                EXPENSE
            </p>

            <h1>
                Add an Expense
            </h1>

            <p>
                Record where your money went.
            </p>

        </div>


        <form
            method="POST"
            class="expense-form"
        >


            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <div class="amount-input">

                    <span>
                        ₹
                    </span>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="category_id">
                    Category
                </label>

                <select
                    id="category_id"
                    name="category_id"
                    required
                >

                    <option value="">
                        Select a category
                    </option>

                    {% for category in categories %}

                        <option
                            value="{{ category.category_id }}"
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="e.g. Lunch with friends"
                    maxlength="255"
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="transaction_date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="transaction_date"
                        name="transaction_date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="payment_method">
                        Payment Method
                    </label>

                    <select
                        id="payment_method"
                        name="payment_method"
                        required
                    >

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="Debit Card">
                            Debit Card
                        </option>

                        <option value="Credit Card">
                            Credit Card
                        </option>

                        <option value="Bank Transfer">
                            Bank Transfer
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-actions">

                <a
                    href="/dashboard"
                    class="secondary-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Expense
                </button>

            </div>


        </form>

    </div>

</section>

{% endblock %}
